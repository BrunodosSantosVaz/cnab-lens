name: Layout ou banco
description: Um campo não bate com o manual do banco, ou você quer suporte a um banco novo
labels: ["layout"]
body:
  - type: markdown
    attributes:
      value: |
        **Não anexe arquivos CNAB reais** (contêm nomes, CPF/CNPJ e valores de terceiros). Troque os dados por
        fictícios ou informe só as posições e os valores envolvidos.
  - type: input
    id: banco
    attributes:
      label: Banco / cooperativa (e código de 3 dígitos)
      placeholder: "Ex.: Sicoob (756)"
    validations:
      required: true
  - type: dropdown
    id: formato
    attributes:
      label: Formato do arquivo
      options: [CNAB400 remessa, CNAB400 retorno, CNAB240 remessa, CNAB240 retorno]
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: O que você quer
      options: [Corrigir um campo (nome, posição ou descrição), Novo banco ou layout, Outro]
    validations:
      required: true
  - type: textarea
    id: detalhe
    attributes:
      label: Detalhes
      description: Posições (início-fim), o que o CNABLens mostra e o que o manual do banco diz.
    validations:
      required: true
  - type: input
    id: fonte
    attributes:
      label: Fonte oficial (link, nome e versão do manual)
